<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hymenaeus · mockup v2</title>
<meta name="theme-color" content="#f5efe1">
<style>
  @font-face { font-family: 'IM Fell English'; font-style: normal; src: url(../fonts/im-fell-english-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'IM Fell English'; font-style: italic; src: url(../fonts/im-fell-english-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'EB Garamond'; font-style: italic; src: url(../fonts/eb-garamond-latin-400-italic.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #f5efe1; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #pick { position: fixed; left: 0; right: 0; bottom: 6px; text-align: center; font: italic 15px 'EB Garamond', serif; color: #5e4520; z-index: 2; }
  #pick button { font: inherit; color: inherit; background: none; border: 1px solid rgba(94,69,32,.4); border-radius: 50%; width: 30px; height: 30px; margin: 0 6px; }
  #pick button.on { border-color: rgba(94,69,32,.95); background: rgba(94,69,32,.08); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pick"><button data-v="A">A</button><button data-v="B">B</button><button data-v="C">C</button></div>
<script>
// Hymenaeus v2 — статичные эскизы компоновки (без звука, не подключены к приложению).
// A «ярусы», B «орбита», C «нотоносец». Тап по полю — подписи. Те же сущности во всех трёх:
// облака (wet) · нить жемчужин (ноты) · три кольца (dry) · ползунок mix · печати-локации (только ноты) · два кубика.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const INK = '94,69,32', GOLD = '176,131,44', BG = '#f5efe1';   // гамма Paradisus: тёплые коричневые чернила, золото на слоновой кости
const ink = (a) => `rgba(${INK},${a})`, gold = (a) => `rgba(${GOLD},${a})`;
const TAU = Math.PI * 2;
let W, H, S, seed = 7, labelsOn = true, V = (new URLSearchParams(location.search).get('v') || 'A').toUpperCase();
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// мелодия текущей локации: высота 0…1 (null — пауза); 7 — играющая жемчужина
const MEL = [.35, .62, .2, null, .82, .5, .15, .72, .4, null, .58], CUR = 7;
// локации: у каждой своя мелодия (мини-контур в печати)
const LOCS = [MEL, [.3, .3, .7, .5, null, .8, .2], [.9, .6, .4, .2, .5, .7, .9, null, .3], [.5, null, .5, .65, null, .35, .5]];

function circle(x, y, r, st, lw) { g.strokeStyle = st; g.lineWidth = lw; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); }
function dot(x, y, r, f) { g.fillStyle = f; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function txt(s, x, y, size, a, align = 'center', fam = 'EB Garamond') {
  g.font = `italic ${size}px '${fam}'`; g.fillStyle = ink(a); g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function lab(s, x, y) { if (labelsOn) txt(s, x, y, 13, .55); }
function star4(x, y, r, st) {
  g.strokeStyle = st; g.lineWidth = 1; g.beginPath();
  g.moveTo(x - r, y); g.lineTo(x + r, y); g.moveTo(x, y - r); g.lineTo(x, y + r);
  g.moveTo(x - r * .4, y - r * .4); g.lineTo(x + r * .4, y + r * .4); g.moveTo(x - r * .4, y + r * .4); g.lineTo(x + r * .4, y - r * .4);
  g.stroke();
}

// ---------- верхняя строка: lad · fx · кубик нот · кубик тембра · undo · корзина ----------
function topBar() {
  const y = 38;
  circle(26, y, 13, ink(.55), 1);
  g.strokeStyle = ink(.8); g.lineWidth = 1.3; g.beginPath(); g.moveTo(28.5, y - 5.5); g.lineTo(23, y); g.lineTo(28.5, y + 5.5); g.stroke();
  txt('Hymenaeus', 47, y - 2, 19, .92, 'left', 'IM Fell English');
  g.strokeStyle = ink(.35); g.lineWidth = 1; g.beginPath(); g.moveTo(47, y + 13); g.lineTo(125, y + 13); g.stroke();
  const B = [[150, 'lad'], [190, 'fx'], [232, 'notes'], [273, 'timbre'], [314, 'undo'], [355, 'trash']];
  for (const [x, k] of B) {
    const r = k === 'fx' ? 19 : 16;
    dot(x, y, r, 'rgba(245,239,225,.95)'); circle(x, y, r, ink(k === 'undo' ? .25 : .6), 1);
    g.strokeStyle = ink(k === 'undo' ? .3 : .85); g.lineWidth = 1.2; g.beginPath();
    if (k === 'lad') { g.moveTo(x - 6, y - 7); g.lineTo(x + 6, y - 7); g.moveTo(x - 1.5, y - 7); g.lineTo(x - 1.5, y + 8); g.moveTo(x + 1.5, y - 7); g.lineTo(x + 1.5, y + 8); }
    if (k === 'fx') { g.arc(x, y, 6, 0, TAU); g.moveTo(x + 11, y); g.arc(x, y, 11, 0, TAU); }
    if (k === 'notes') {                          // кубик: ноты (три жемчужины разной высоты)
      g.stroke(); g.beginPath(); g.rect(x - 8, y - 8, 16, 16); g.stroke();
      dot(x - 4, y + 3, 1.6, ink(.85)); dot(x, y - 3, 2.1, ink(.85)); dot(x + 4, y + 1, 1.3, ink(.85)); g.beginPath();
    }
    if (k === 'timbre') { g.stroke(); circle(x, y, 8, ink(.85), 1.2); g.beginPath(); star4(x, y, 4, ink(.85)); g.beginPath(); }
    if (k === 'undo') { g.arc(x + 1, y + 1, 7, -2.6, 1.6); g.moveTo(x - 9, y - 7); g.lineTo(x - 5.5, y - 2.5); g.lineTo(x - 0.5, y - 5); }
    if (k === 'trash') { g.moveTo(x - 8, y - 6); g.lineTo(x + 8, y - 6); g.moveTo(x - 3, y - 6); g.lineTo(x - 3, y - 9); g.lineTo(x + 3, y - 9); g.lineTo(x + 3, y - 6); g.rect(x - 6, y - 6, 12, 15); g.moveTo(x - 2, y - 2); g.lineTo(x - 2, y + 6); g.moveTo(x + 2, y - 2); g.lineTo(x + 2, y + 6); }
    g.stroke();
  }
}

// ---------- печати-локации: мини-контур мелодии внутри кружка; активная — двойной ободок ----------
function seals(y, active, x0 = 105, dx = 60) {
  LOCS.forEach((m, i) => {
    const x = x0 + i * dx, on = i === active, r = 17;
    dot(x, y, r, BG); circle(x, y, r, ink(on ? .9 : .4), on ? 1.2 : 1);
    if (on) circle(x, y, r - 3.5, ink(.45), .8);
    g.strokeStyle = ink(on ? .85 : .5); g.lineWidth = 1; g.beginPath();
    let pen = false;
    m.forEach((p, j) => {
      const px = x - 9 + j / (m.length - 1) * 18, py = y + 5 - (p ?? .5) * 10;
      if (p == null) { pen = false; return; }
      dot(px, py, .9, ink(on ? .85 : .5));
    });
    txt(['i', 'ii', 'iii', 'iv'][i], x, y + r + 9, 12, on ? .8 : .4);
  });
  if (labelsOn) txt('loca', x0 - 46, y, 13, .55);
}

// ---------- облако (объединение кругов, штриховка снизу) ----------
function cloud(cx, cy, sc, a, hatch = true) {
  seed = Math.round(cx * 7 + cy);
  const C = [], n = 7;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1) - .5;
    C.push([cx + t * 120 * sc, cy - Math.cos(t * Math.PI) * 14 * sc + (rnd() - .5) * 8 * sc, (17 + Math.cos(t * Math.PI) * 15 + rnd() * 6) * sc]);
  }
  C.push([cx - 25 * sc, cy + 8 * sc, 20 * sc], [cx + 22 * sc, cy + 9 * sc, 19 * sc]);
  const inside = (x, y, j) => C.some(([X, Y, R], k) => k !== j && (x - X) ** 2 + (y - Y) ** 2 < R * R - .5);
  if (hatch) {
    g.fillStyle = BG; g.beginPath(); for (const [X, Y, R] of C) { g.moveTo(X + R, Y); g.arc(X, Y, R, 0, TAU); } g.fill();
    g.save(); g.beginPath(); for (const [X, Y, R] of C) { g.moveTo(X + R, Y); g.arc(X, Y, R, 0, TAU); } g.clip();
    const bot = Math.max(...C.map(([X, Y, R]) => Y + R));
    g.strokeStyle = ink(a * .22); g.lineWidth = .8;
    for (let y = cy - 2 * sc; y < bot; y += 3.4) { g.beginPath(); g.moveTo(cx - 90 * sc, y); g.lineTo(cx + 90 * sc, y + 1.5); g.stroke(); }
    g.restore();
  }
  g.strokeStyle = ink(a); g.lineWidth = 1.1;
  C.forEach(([X, Y, R], j) => {
    g.beginPath(); let on = false;
    for (let k = 0; k <= 90; k++) {
      const t = k / 90 * TAU, x = X + Math.cos(t) * R, y = Y + Math.sin(t) * R;
      if (inside(x, y, j)) { on = false; continue; }
      if (on) g.lineTo(x, y); else g.moveTo(x, y); on = true;
    }
    g.stroke();
  });
  return C;
}
function rice(x, y, hw, hh, a) {                 // окно зерна между скобками — заштриховано (густота штрихов = densitas, ширина = granum)
  g.lineWidth = .8;
  for (let gy = -hh + 2; gy <= hh - 2; gy += 3) {
    g.strokeStyle = ink(a); g.beginPath(); g.moveTo(x - hw + 1, y + gy); g.lineTo(x + hw - 1, y + gy); g.stroke();
  }
}
// облака: два облака, зона их пересечения заштрихована — её площадь = число гранул (densitas).
// Эхо — бледные призраки второго облака справа. (cx, cy) — центр; sc — размер
function clouds(cx, cy, sc) {
  const A = cloud(cx - 34 * sc, cy - 6 * sc, sc, .8);
  const B = cloud(cx + 34 * sc, cy + 8 * sc, sc, .8, false);
  cloud(cx + 52 * sc, cy + 10 * sc, sc, .13, false);
  cloud(cx + 70 * sc, cy + 12 * sc, sc, .06, false);
  const path = (C) => { g.beginPath(); for (const [X, Y, R] of C) { g.moveTo(X + R, Y); g.arc(X, Y, R, 0, TAU); } g.clip(); };
  g.save(); path(A); path(B);
  g.strokeStyle = ink(.5); g.lineWidth = .8;
  for (let y = cy - 70 * sc; y < cy + 70 * sc; y += 3) { g.beginPath(); g.moveTo(cx - 100 * sc, y); g.lineTo(cx + 100 * sc, y); g.stroke(); }
  g.restore();
  // позиция чтения: нить сверху вниз через пересечение
  const top = cy - 62 * sc, bot = cy + 46 * sc;
  g.setLineDash([2, 4]); g.strokeStyle = ink(.35); g.lineWidth = 1; g.beginPath(); g.moveTo(cx, top); g.lineTo(cx, bot); g.stroke(); g.setLineDash([]);
  g.save(); g.translate(cx, top); g.rotate(Math.PI / 4); g.strokeStyle = ink(.8); g.lineWidth = 1.1; g.strokeRect(-3.5, -3.5, 7, 7); g.restore();
}

// ---------- mix: dry ↔ wet. Волосяная линия, кружок-бегунок; слева сухо (кольца), справа влажно (облака + ревербер) ----------
function mix(x0, y0, x1, y1, t) {
  g.strokeStyle = ink(.4); g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  for (let i = 0; i <= 4; i++) { const u = i / 4, x = x0 + (x1 - x0) * u, y = y0 + (y1 - y0) * u, vert = x0 === x1; g.beginPath(); vert ? (g.moveTo(x - 3, y), g.lineTo(x + 3, y)) : (g.moveTo(x, y - 3), g.lineTo(x, y + 3)); g.stroke(); }
  const kx = x0 + (x1 - x0) * t, ky = y0 + (y1 - y0) * t;
  dot(kx, ky, 8, BG); circle(kx, ky, 8, ink(.9), 1.2);
  // внутри бегунка: слева — кольцо, справа — облачко, пропорционально
  g.strokeStyle = gold(.9); g.lineWidth = 1; g.beginPath(); g.arc(kx, ky, 3.2, 0, TAU * (1 - t * .8)); g.stroke();
}
function mixLabels(x0, y0, x1, y1, vert) {
  if (!labelsOn) return;
  if (vert) { txt('umida', x0, y0 - 14, 13, .55); txt('sicca', x1, y1 + 14, 13, .55); }
  else { txt('sicca', x0 - 2, y0 + 15, 13, .55); txt('umida', x1 + 2, y1 + 15, 13, .55); }
}

// ---------- кольца (золото). mode: 'modal' — концентрические волны; 'strings' — натянутые струны ----------
function band(cx, cy, R, w, a) {
  g.fillStyle = BG; g.beginPath(); g.arc(cx, cy, R + w / 2, 0, TAU); g.arc(cx, cy, R - w / 2, 0, TAU, true); g.fill();
  circle(cx, cy, R + w / 2, gold(a), 1.3); circle(cx, cy, R - w / 2, gold(a * .85), 1);
  g.lineWidth = .8;
  for (let k = 0; k < 120; k++) {
    const t = k / 120 * TAU, sh = .5 + .5 * Math.sin(t - 0.6);
    if (k % (sh > .6 ? 1 : 3)) continue;
    g.strokeStyle = gold(a * (.15 + sh * .35));
    g.beginPath(); g.moveTo(cx + Math.cos(t) * (R - w / 2 + 1), cy + Math.sin(t) * (R - w / 2 + 1)); g.lineTo(cx + Math.cos(t) * (R + w / 2 - 1), cy + Math.sin(t) * (R + w / 2 - 1)); g.stroke();
  }
}
function ring(cx, cy, R, mode, a, struck) {
  const w = Math.max(7, R * .22);
  if (mode === 'modal') for (let i = 1; i <= 3; i++) circle(cx, cy, R - w / 2 - i * 6, gold(a * .25 / i), .8);
  else for (let i = -1; i <= 1; i++) {            // струны: волнистые хорды
    g.strokeStyle = gold(a * .3); g.lineWidth = .8; g.beginPath();
    const yy = cy + i * R * .3, half = Math.sqrt(Math.max(0, (R - w / 2) ** 2 - (i * R * .3) ** 2));
    for (let k = 0; k <= 30; k++) { const u = k / 30, x = cx - half + 2 * half * u; k ? g.lineTo(x, yy + Math.sin(u * 14 + i) * 1.6) : g.moveTo(x, yy); }
    g.stroke();
  }
  band(cx, cy, R, w, a);
  if (struck != null) {                           // место удара на ободе (true — сверху-слева, число — угол)
    const ht = struck === true ? -2.2 : struck, hx = cx + Math.cos(ht) * (R + w / 2), hy = cy + Math.sin(ht) * (R + w / 2);
    const gr = g.createRadialGradient(hx, hy, 0, hx, hy, 22); gr.addColorStop(0, gold(.35)); gr.addColorStop(1, gold(0));
    g.fillStyle = gr; g.beginPath(); g.arc(hx, hy, 22, 0, TAU); g.fill(); star4(hx, hy, 6, gold(.95));
    return [hx, hy];
  }
}

// ---------- жемчужина ----------
function pearl(x, y, p, cur) {
  const r = 4.5 + p * 5;
  dot(x, y, r, BG); circle(x, y, r, ink(cur ? .95 : .55), 1);
  dot(x - r * .35, y - r * .35, Math.max(.7, r * .22), ink(cur ? .95 : .45));
  if (cur) { const gr = g.createRadialGradient(x, y, 0, x, y, 20); gr.addColorStop(0, ink(.2)); gr.addColorStop(1, ink(0)); g.fillStyle = gr; g.beginPath(); g.arc(x, y, 20, 0, TAU); g.fill(); }
}
function rest(x, y) { circle(x, y, 2.2, ink(.25), .8); }
function strike(x, y, hx, hy) { g.setLineDash([1.5, 3]); g.strokeStyle = gold(.85); g.lineWidth = 1.1; g.beginPath(); g.moveTo(x, y); g.lineTo(hx, hy); g.stroke(); g.setLineDash([]); }
function clasp(x, y, open) {                       // застёжка: два крючка; зазор — déjà vu
  circle(x, y - open, 2.6, ink(.6), .9); circle(x, y + open, 2.6, ink(.6), .9);
}

// ================= А · ярусы: облака — mix — нить — кольца, сверху вниз =================
function sceneA() {
  seals(92, 0);
  clouds(215, 215, 1.15); lab('nubes', 52, 160);
  mix(70, 335, 320, 335, .62); mixLabels(70, 335, 320, 335, false);
  // нить: лёгкая дуга, высота жемчужины = высота ноты; строка натянута сквозь них
  const x0 = 38, x1 = 338, base = 480, pts = MEL.map((p, i) => [x0 + i / (MEL.length - 1) * (x1 - x0), base - (p ?? .5) * 76 + Math.sin(i / 10 * Math.PI) * 14]);
  g.strokeStyle = ink(.35); g.lineWidth = .8; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.lineTo(358, pts[pts.length - 1][1]); g.stroke();
  clasp(358, pts[pts.length - 1][1], 4);
  const rg = [[80, 690, 46, 'modal'], [195, 690, 38, 'strings'], [295, 690, 28, 'modal']];
  const hit = ring(rg[0][0], rg[0][1], rg[0][2], rg[0][3], .95, true); ring(rg[1][0], rg[1][1], rg[1][2], rg[1][3], .6); ring(rg[2][0], rg[2][1], rg[2][2], rg[2][3], .6);
  pts.forEach(([x, y], i) => { MEL[i] == null ? rest(x, y) : pearl(x, y, MEL[i], i === CUR); });
  strike(pts[CUR][0], pts[CUR][1], hit[0], hit[1]);
  lab('margaritae', 195, 410); lab('anuli', 195, 770); lab('déjà vu', 340, 448);
}

// ================= B · орбита: нить обвивает кольца; облака сверху; mix справа =================
function sceneB() {
  clouds(205, 175, 1.05); lab('nubes', 52, 125);
  mix(364, 300, 364, 500, .38); mixLabels(364, 300, 364, 500, true);
  const cx = 190, cy = 580, rx = 150, ry = 120, gap0 = -1.05, gap1 = -.7;
  g.strokeStyle = ink(.32); g.lineWidth = .8; g.beginPath();
  for (let i = 0; i <= 220; i++) { const t = gap1 + i / 220 * (TAU - (gap1 - gap0)); i ? g.lineTo(cx + Math.cos(t) * rx, cy + Math.sin(t) * ry) : g.moveTo(cx + Math.cos(t) * rx, cy + Math.sin(t) * ry); }
  g.stroke();
  for (const t of [gap0, gap1]) circle(cx + Math.cos(t) * rx, cy + Math.sin(t) * ry, 2.6, ink(.6), .9);
  // три кольца треугольником внутри нити, не соприкасаются
  const R = [[135, 600, 40, 'modal'], [245, 600, 33, 'strings'], [190, 520, 26, 'modal']];
  const hit = ring(R[0][0], R[0][1], R[0][2], R[0][3], .95, true); ring(R[1][0], R[1][1], R[1][2], R[1][3], .6); ring(R[2][0], R[2][1], R[2][2], R[2][3], .6);
  let cur;
  MEL.forEach((p, i) => {
    const t = gap1 + .2 + i / (MEL.length - 1) * (TAU - (gap1 - gap0) - .4), x = cx + Math.cos(t) * rx, y = cy + Math.sin(t) * ry;
    p == null ? rest(x, y) : pearl(x, y, p, i === CUR); if (i === CUR) cur = [x, y];
  });
  strike(cur[0], cur[1], hit[0], hit[1]);
  seals(762, 0, 105, 62);
  lab('anuli', 190, 668); lab('déjà vu', 322, 548);
}

// ================= C · нотоносец, два переплетённых кольца: резонатор (modal) и струна (strings), у каждого своя нить на своём стане =================
const MEL2 = [.7, .3, .5, .9, null, .4, .6, .2];   // нить струны: короче и другая
function sceneC() {
  seals(772, 0, 105, 62);
  clouds(185, 175, 1.3); lab('nubes', 52, 118);
  mix(70, 298, 320, 298, .7); mixLabels(70, 298, 320, 298, false);
  const rows = [[352, MEL, 2, 'resonans'], [446, MEL2, 5, 'chorda']], x0 = 42, x1 = 332, step = 16, pts = [];
  rows.forEach(([top, mel, cur, name]) => {
    for (let i = 0; i < 5; i++) { g.strokeStyle = ink(.16); g.lineWidth = .8; g.beginPath(); g.moveTo(22, top + i * step); g.lineTo(370, top + i * step); g.stroke(); }
    const P = mel.map((p, i) => [x0 + i / (mel.length - 1) * (x1 - x0), top + (4 - Math.round((p ?? .5) * 8) / 2) * step]);
    g.strokeStyle = ink(.4); g.lineWidth = .8; g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    clasp(356, P[P.length - 1][1], 4);
    pts.push([P, mel, cur]);
    lab(name, 62, top - 11);
  });
  // два кольца переплетены: справа внизу струна поверх резонатора, слева — наоборот
  const cy = 668, R = 50, w = 11, A = [158, cy], B = [232, cy];
  const hitA = ring(A[0], cy, R, 'modal', .95, -2.35);
  // порядок: сначала резонатор целиком, затем струна, затем заплатка там, где резонатор должен пройти поверх
  const hitB = ring(B[0], cy, R, 'strings', .8, -0.8);
  const dx = (B[0] - A[0]) / 2, hy = Math.sqrt(R * R - dx * dx);
  g.save(); g.beginPath(); g.arc(A[0] + dx, cy - hy, w * 1.8, 0, TAU); g.clip(); band(A[0], cy, R, w, .95); g.restore();
  [hitA, hitB].forEach((h, i) => { const [P, mel, cur] = pts[i]; strike(P[cur][0], P[cur][1], h[0], h[1]); });
  pts.forEach(([P, mel, cur]) => P.forEach(([x, y], i) => { mel[i] == null ? rest(x, y) : pearl(x, y, mel[i], i === cur); }));
  lab('anuli', 195, 734); lab('déjà vu', 338, 433);
}

function draw() {

  g.restore();

}
document.querySelectorAll('#pick button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); V = b.dataset.v; draw(); }));
